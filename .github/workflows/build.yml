name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Unpack project
        run: unzip -o ChessAssistantV2.zip
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sf
          gh release download --repo official-stockfish/Stockfish --pattern '*android*' --dir sf || true
          if [ -z "$(ls -A sf)" ]; then
            TAG=$(gh release list --repo official-stockfish/Stockfish --limit 1 --json tagName -q '.[0].tagName')
            gh release download "$TAG" --repo official-stockfish/Stockfish --pattern '*android*' --dir sf
          fi
          ls -la sf
          cd sf
          for f in *.tar *.tar.gz *.tgz; do [ -f "$f" ] && tar -xf "$f"; done || true
          cd ..
          BIN=$(find sf -type f -size +5M ! -name '*.tar*' ! -name '*.tgz' ! -name '*.nnue' ! -name '*dotprod*' | head -1)
          echo "Using $BIN"
          file "$BIN"
          cp "$BIN" ChessAssistant/app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        run: cd ChessAssistant && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-apk
          path: ChessAssistant/app/build/outputs/apk/debug/app-debug.apk
