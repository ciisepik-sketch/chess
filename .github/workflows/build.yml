name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Unpack project
        run: unzip ChessAssistant.zip
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo official-stockfish/Stockfish --pattern '*android*armv8*' --dir sf
          cd sf && for f in *.tar; do tar xf "$f"; done && cd ..
          BIN=$(find sf -type f -name 'stockfish-android-armv8*' ! -name '*.tar' | head -1)
          echo "Using $BIN"
          cp "$BIN" ChessAssistant/app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        run: cd ChessAssistant && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-apk
          path: ChessAssistant/app/build/outputs/apk/debug/app-debug.apk
