name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Unpack project
        run: unzip ChessAssistant.zip
      - name: Apply fixes
        run: |
          cat > ChessAssistant/app/src/main/java/com/chessassistant/ScreenCapturer.kt <<'KOTLIN'
          package com.chessassistant

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.os.Handler
          import android.os.HandlerThread
          import android.view.WindowManager
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withTimeoutOrNull
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.coroutines.resume

          class ScreenCapturer(
              private val context: Context,
              private val projection: MediaProjection,
              onStopped: () -> Unit
          ) {
              private val thread = HandlerThread("screen-capture").apply { start() }
              private val handler = Handler(thread.looper)

              init {
                  projection.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { onStopped() }
                  }, handler)
              }

              suspend fun capture(): Bitmap? = withTimeoutOrNull(4000) {
                  suspendCancellableCoroutine<Bitmap?> { cont ->
                      val wm = context.getSystemService(WindowManager::class.java)
                      val bounds = wm.maximumWindowMetrics.bounds
                      val w = bounds.width()
                      val h = bounds.height()
                      val dpi = context.resources.displayMetrics.densityDpi
                      val reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                      val holder = arrayOfNulls<VirtualDisplay>(1)
                      val latest = arrayOfNulls<Bitmap>(1)
                      val finished = AtomicBoolean(false)
                      var pending = false

                      fun finish(bmp: Bitmap?) {
                          if (!finished.compareAndSet(false, true)) { bmp?.recycle(); return }
                          try { holder[0]?.release() } catch (_: Exception) { }
                          try { reader.close() } catch (_: Exception) { }
                          if (cont.isActive) cont.resume(bmp) else bmp?.recycle()
                      }
                      fun finishWithLatest() {
                          val b = latest[0]
                          latest[0] = null
                          finish(b)
                      }
                      val timeout = Runnable { finishWithLatest() }

                      reader.setOnImageAvailableListener({ r ->
                          if (finished.get()) return@setOnImageAvailableListener
                          val img = try { r.acquireLatestImage() } catch (e: Exception) { null }
                          if (img != null) {
                              val bmp = try { toBitmap(img, w, h) } catch (e: Exception) { null } finally { img.close() }
                              if (bmp != null) {
                                  latest[0]?.recycle()
                                  latest[0] = bmp
                                  if (!isBlank(bmp)) {
                                      handler.removeCallbacks(timeout)
                                      finishWithLatest()
                                  } else if (!pending) {
                                      pending = true
                                      handler.postDelayed(timeout, 900)
                                  }
                              }
                          }
                      }, handler)

                      holder[0] = projection.createVirtualDisplay(
                          "chess-capture", w, h, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.surface, null, handler
                      )
                      if (finished.get()) { try { holder[0]?.release() } catch (_: Exception) { } }
                      cont.invokeOnCancellation { handler.post { finish(null) } }
                  }
              }

              private fun isBlank(b: Bitmap): Boolean {
                  for (iy in 1..20) for (ix in 1..20) {
                      val p = b.getPixel(b.width * ix / 21, b.height * iy / 21)
                      if ((p and 0x00FFFFFF) != 0) return false
                  }
                  return true
              }

              private fun toBitmap(img: Image, w: Int, h: Int): Bitmap {
                  val plane = img.planes[0]
                  val pixelStride = plane.pixelStride
                  val rowPadding = plane.rowStride - pixelStride * w
                  val padded = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                  padded.copyPixelsFromBuffer(plane.buffer)
                  val out = if (padded.width == w) padded
                  else Bitmap.createBitmap(padded, 0, 0, w, h).also { padded.recycle() }
                  out.setHasAlpha(false)
                  return out
              }

              fun release() {
                  try { projection.stop() } catch (_: Exception) { }
                  thread.quitSafely()
              }
          }
          KOTLIN
          python3 - <<'PY'
          def patch(path, old, new):
              s = open(path, encoding='utf-8').read()
              if old not in s:
                  raise SystemExit('PATCH FAILED in ' + path + ': ' + old[:50])
              open(path, 'w', encoding='utf-8').write(s.replace(old, new, 1))

          base = 'ChessAssistant/app/src/main/java/com/chessassistant/'

          OLD1 = r'''return "Square ${'a' + file}${rank + 1} looks empty. Is the board area aligned and the board in the starting position?"'''
          NEW1 = r'''return "Square ${'a' + file}${rank + 1} looks empty (blob ${info.area} of $MIN_AREA, centre #${Integer.toHexString(px[(row * SQ + SQ / 2) * BOARD_PX + col * SQ + SQ / 2])}, corner #${Integer.toHexString(px[(row * SQ + 4) * BOARD_PX + col * SQ + 4])}). A debug picture was saved in Pictures/ChessAssistant."'''
          patch(base + 'BoardRecognizer.kt', OLD1, NEW1)

          OLD2 = r'''val err = withContext(Dispatchers.Default) { recognizer.learn(board, whiteBottom) }'''
          NEW2 = OLD2 + "\n                if (err != null) saveDebugImage(board)"
          patch(base + 'OverlayService.kt', OLD2, NEW2)

          OLD3 = r'''private fun learnPieces() {'''
          NEW3 = r'''private fun saveDebugImage(b: Bitmap) {
              try {
                  val values = android.content.ContentValues().apply {
                      put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, "chess_debug_" + System.currentTimeMillis() + ".png")
                      put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/png")
                      put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/ChessAssistant")
                  }
                  val uri = contentResolver.insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return
                  contentResolver.openOutputStream(uri)?.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
              } catch (_: Exception) { }
          }

          private fun learnPieces() {'''
          patch(base + 'OverlayService.kt', OLD3, NEW3)
          PY
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sf
          gh release download --repo official-stockfish/Stockfish --pattern '*android*' --dir sf || true
          if [ -z "$(ls -A sf)" ]; then
            TAG=$(gh release list --repo official-stockfish/Stockfish --limit 1 --json tagName -q '.[0].tagName')
            gh release download "$TAG" --repo official-stockfish/Stockfish --pattern '*android*' --dir sf
          fi
          ls -la sf
          cd sf
          for f in *.tar *.tar.gz *.tgz; do [ -f "$f" ] && tar -xf "$f"; done || true
          cd ..
          BIN=$(find sf -type f -size +5M ! -name '*.tar*' ! -name '*.tgz' ! -name '*.nnue' ! -name '*dotprod*' | head -1)
          echo "Using $BIN"
          file "$BIN"
          cp "$BIN" ChessAssistant/app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Rename app
        run: |
          sed -i 's/<string name="app_name">Chess Assistant<\/string>/<string name="app_name">Cjs stockfish<\/string>/' ChessAssistant/app/src/main/res/values/strings.xml
          sed -i 's/text = "Chess Assistant"; textSize = 26f/text = "Cjs stockfish"; textSize = 26f/' ChessAssistant/app/src/main/java/com/chessassistant/MainActivity.kt
          grep -n "Cjs stockfish" ChessAssistant/app/src/main/res/values/strings.xml ChessAssistant/app/src/main/java/com/chessassistant/MainActivity.kt
      - name: Build
        run: cd ChessAssistant && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-apk
          path: ChessAssistant/app/build/outputs/apk/debug/app-debug.apk
